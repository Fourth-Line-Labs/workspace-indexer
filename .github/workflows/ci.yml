name: ci

on:
  push:
    branches: [main]
  # Every pull request, whatever it targets. Filtering on `branches: [main]`
  # means a stacked pull request -- one based on another branch while it waits
  # to merge -- gets no CI at all. Not a failing check, no check: the page is
  # simply green and empty, which is indistinguishable from passing unless you
  # look for what is missing. Found exactly that way.
  pull_request:

# A second push supersedes the first: no point finishing a run for a commit
# nobody will merge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job name is what GitHub publishes as the status check, not the workflow
  # name above. The MainProtection ruleset requires a check called "ci", so the
  # job has to be called that -- naming it "gates" left the ruleset waiting for
  # a check that would never appear, blocking every merge.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install poetry
        run: pipx install poetry

      # Keyed on the lock file, so the cache is only rebuilt when dependencies
      # actually change. onnxruntime and the tree-sitter grammars are large
      # enough that this is the difference between a fast run and a slow one.
      - name: Cache the virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py312-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --all-extras

      # Three separate steps rather than one, so a failure says which gate
      # failed without anyone reading the log.
      - name: Lint (ruff)
        run: poetry run ruff check src/ tests/

      # `check` and `format` catch different things: check is lint rules,
      # format is layout. Without this gate the tree drifts out of formatted
      # shape, and then the first person to run `ruff format` sweeps twenty
      # untouched files into an unrelated pull request.
      - name: Format (ruff)
        run: poetry run ruff format --check src/ tests/

      - name: Types (pyright, strict)
        run: poetry run pyright

      # Named separately from the suite below so a failure says "a list drifted"
      # or "something leaks between tests" without anyone reading the log.
      # These are the two failure classes that have actually cost us time, and
      # both are silent: a stale list describes a system that no longer exists,
      # and leaked state fails a test that has nothing to do with the change.
      - name: Guards (drift, leaks, store contract)
        run: |
          poetry run pytest -q -m "not integration" \
            tests/test_no_drift.py \
            tests/test_no_leaks.py \
            tests/test_log_once_isolation.py \
            tests/test_vector_store_contract.py

      # The offline half of the eval, named separately for the same reason the
      # guards are: a failure here means extraction, resolution, classification
      # or the secret scanner changed what they produce, which is a different
      # thing from a broken unit test and calls for reading a diff rather than
      # a traceback. It needs no key and no network because every number it
      # asserts is a pure function of the fixture bytes.
      - name: Language fixture baselines
        run: poetry run pytest -q -m "not integration" tests/test_language_fixtures.py

      # Deliberately excludes integration tests: those download embedding and
      # reranking models, and nothing here needs an API key or network. That
      # was a design goal from the first iteration and this is where it pays
      # off -- the full suite runs on a clean runner with no credentials.
      - name: Tests
        run: poetry run pytest -q -m "not integration"

      # Integration tests do not run here, which is exactly how one of them
      # rotted: `impact_of` shipped and the stdio test went on asserting the
      # four tools that existed before it, green the whole time. Collecting
      # them imports every module and evaluates every decorator, so an import
      # error, a renamed fixture or a bad signature fails here rather than
      # weeks later on someone's laptop. It cannot catch a wrong assertion --
      # that is what the drift guard above is for.
      - name: Integration tests still import and collect
        run: poetry run pytest -m integration --collect-only -q
