# Copy to config/workspace.yaml (gitignored) and edit for your machine.
#
# This file is *what to index* and is safe to commit. Credentials and backend
# selection live in .env — see .env.example.

# One entry is the ordinary case. `workspace:` (singular) still works and means
# exactly this with one entry, so an older config needs no edit.
#
# Several entries are several *separate* indexes in one process: each gets its
# own collection and its own manifest, and a search never crosses between them.
# Reach for that when the trees must not mix — different clients, or a corpus
# whose size would shift your eval baselines — rather than for unrelated repos,
# which are better as extra `roots` under one workspace.
workspaces:
  - name: labbox
    roots:
      # A workspace root holding a mix of git repos and plain folders. With
      # recurse_into_children, each immediate subdirectory becomes its own "unit",
      # so `--unit repo_two` works for plain folders as well as repos.
      - path: ~/src
        recurse_into_children: true

      # A specific directory indexed on its own. Hidden directories are fine —
      # .claude is a primary target, not something to skip.
      - path: ~/src/workspace-indexer/.claude
        label: claude-config

  # A second workspace. Everything below this block — excludes, chunking,
  # search, watch — is shared by all of them; only these three keys vary.
  #
  # - name: other-client
  #   roots:
  #     - path: ~/src/other-client
  #       recurse_into_children: true
  #   # Its own eval dataset, so its baselines are its own.
  #   eval:
  #     dataset: ./config/other-client-eval.yaml
  #   # Its own embedding model. The case this exists for is code that may not
  #   # leave the machine: embed it locally while another workspace uses a
  #   # hosted model. Anything omitted here is inherited from .env.
  #   embedding:
  #     model: fastembed:BAAI/bge-small-en-v1.5
  #     dimensions: 384

# Where per-workspace manifests live, one file per workspace named after it.
# Null means "use STATE_DB from .env", which is the single-workspace default and
# leaves an existing index exactly where it is. Required once there is more than
# one workspace, because STATE_DB names a single file and the manifest has no
# workspace column — two workspaces sharing one would collide on any root label
# they happen to share.
state_dir: null

index:
  respect_gitignore: true
  follow_symlinks: false
  max_file_bytes: 1_048_576
  # gitignore syntax. Our own logs/ and data/ are excluded unconditionally in
  # code — a log file inside a watched root is an infinite reindex loop.
  exclude:
    - "**/node_modules/**"
    - "**/.venv/**"
    - "**/__pycache__/**"
    - "**/dist/**"
    - "**/build/**"
    - "**/target/**"
    - "**/.mypy_cache/**"
    - "**/.pytest_cache/**"
    - "**/.ruff_cache/**"
    # A corpus repo cloned under a configured root joins the main index
    # and shifts every eval number for reasons unrelated to any code
    # change. Give it its own workspace name instead, so it gets its own
    # collection and its own baselines.
    # - "SomeBigCorpusRepo/**"
    # Our own eval artefacts (config/eval.yaml, evals/, docs/eval-baselines.md)
    # need no entry here: they quote every eval query verbatim, so excluding
    # them is a correctness rule and is enforced in code, not configuration.

  # Paths where the content secret-scan is expected to produce false
  # positives: fixtures holding synthetic tokens, files of checksums. Scoped
  # by glob, so allowing one file does not disable the check elsewhere.
  secret_allow:
    - "**/tests/test_secret_scanner.py"
    - "**/tests/test_file_reader.py"

chunking:
  # Prefix `# type: normative` to the context header, so the embedder sees the
  # classification and not only the payload filter does.
  #
  # False on measured evidence: it made recall@10 worse (0.875 -> 0.812), and
  # worst on the guidance cases the idea was meant to help. `doc_type` has nine
  # values across thousands of chunks, so the line carries almost no
  # discriminating signal and makes chunks marginally more alike. See
  # docs/iteration-2-plan.md.
  #
  # Changing it needs `index --force`: the header is excluded from content_sha,
  # so a normal run finds identical chunk ids and re-embeds nothing.
  embed_doc_type: false

  # Pin an extension to a chunker when its detected language routes it
  # somewhere unhelpful. The extension point for a new file type.
  overrides: {}
    # ".mdx": "markdown"
  code:
    max_tokens: 512
    min_tokens: 24
    include_context_header: true
  markdown:
    max_tokens: 512
    split_on_heading_depth: 3
  text:
    max_tokens: 512
    overlap_paragraphs: 1
  opaque:
    # Images and binaries are recorded in the manifest but not embedded.
    # caption / multimodal are the declared upgrade paths.
    mode: metadata_only

search:
  # Check each hit against the file on disk before returning it, so a
  # result never silently shows text that no longer exists. Needs read
  # access to the indexed source: set false where the MCP server runs next
  # to Qdrant rather than next to the code, or every hit comes back flagged
  # stale. See docs/deployment.md.
  check_staleness: true
  fusion: rrf            # rrf | dense_only | sparse_only (latter two for debugging)
  prefetch_limit: 50
  default_limit: 10
  rerank:
    enabled: true
    model: voyageai:rerank-2.5-lite   # or fastembed:Xenova/ms-marco-MiniLM-L-6-v2
    candidates: 50
    top_n: 10
    rerank_text: embed_text
    # rerank-2.5* follow instructions but expose no instruction parameter, so
    # this gets prepended to the query.
    instruction: >
      Prioritize implementation code over tests, fixtures, and generated files.
    on_error: degrade    # degrade | fail

graph:
  # Functions that make an HTTP request, so a client call site can be matched
  # to the endpoint it calls. Name whatever your codebase wraps fetch in --
  # measured on a real React workspace, naming the project's own wrapper took
  # call sites found from 6 to 71. An object name (axios) covers its request
  # methods (axios.get, axios.post).
  http_clients: [fetch, axios, ky, superagent]
  # Directory whose contents map to routes by file path. Razor Pages usually
  # declares `@page` with no template and derives the URL from location.
  razor_pages_dir: Pages
  # Segments the client prepends that the server never declares -- added by a
  # proxy, a dev-server rewrite, or UsePathBase. Tried only after the URL as
  # written fails, so routes that really do start with `api` are unaffected.
  client_base_paths: [api]

eval:
  dataset: ./config/eval.yaml
  metrics: [recall@10, mrr@10]

watch:
  # auto decides per root from the filesystem backing it, which is almost
  # always right. inotify on a 9p/CIFS/NFS mount *succeeds* and then never
  # delivers an event, so a root on one is polled instead.
  #   auto | native | poll
  mode: auto
  # Wait this long after the last event before reindexing. One editor save is
  # several events and a formatter run is hundreds.
  debounce_ms: 1500
  # Polling interval for roots that cannot use inotify.
  poll_interval_ms: 5000
  # Reload this file when it changes. Settings and ignore rules go live; a
  # newly added *root* still needs `watch` restarted.
  reload_config: true

logging:
  # The rolling file sink. Always DEBUG regardless of the console level: the
  # console is for watching, the file is for forensics, and you cannot
  # retroactively raise a log level after the failure you needed to see.
  #
  # Size-based rather than daily rotation, because indexer output is bursty --
  # a full reindex produces a huge volume in minutes, then near-silence.
  file:
    path: ./logs/workspace-indexer.jsonl
    max_bytes: 20_971_520      # 20 MB x 10 backups = a 200 MB ceiling
    backup_count: 10
  level: INFO
  console: pretty        # pretty | json | off
  file:
    path: ./logs/workspace-indexer.jsonl
    max_bytes: 20_971_520
    backup_count: 10
  logfire:
    enabled: false
    # Leave false unless you accept that pydantic-ai instrumentation captures
    # call inputs — and for an embedding call, the input is your source code.
    send_to_cloud: false
