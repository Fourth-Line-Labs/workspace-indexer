[project]
name = "workspace-indexer"
version = "0.1.0"
description = "Semantic + keyword index over a multi-repo workspace, built for LLM retrieval"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
authors = [{ name = "Jeremy Vetter", email = "jvetter@intertech.com" }]

dependencies = [
    # config + models
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    # dense embeddings: one typed API over many providers
    "pydantic-ai-slim[voyageai]>=2.33",
    # reranking (and, later, multimodal) — not covered by pydantic-ai's embeddings API
    "voyageai>=0.5",
    # sparse BM25 + a light local dense model for offline/test use
    "fastembed>=0.8",
    # vector store
    "qdrant-client>=1.19",
    # parsing
    "tree-sitter>=0.25",
    "tree-sitter-language-pack>=1.15",
    # discovery
    "pathspec>=1.1",
    # how an agent reaches the index mid-session
    "mcp>=2.1",
    # cli + logging
    "typer>=0.27",
    "structlog>=26.1",
    "rich>=13.0",
    "concurrent-log-handler (>=0.9.29,<0.10.0)",
]

[project.optional-dependencies]
logfire = ["logfire>=4.0", "pydantic-ai-slim[logfire]>=2.33"]
watch = ["watchfiles>=1.2"]
pdf = ["pymupdf>=1.24"]
mongo = ["pymongo (>=4.10)"]

[project.scripts]
workspace-indexer = "workspace_indexer.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "pyright>=1.1.400",
]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "workspace_indexer", from = "src" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs network or a running Qdrant server (deselect with -m 'not integration')",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# The language fixtures are corpus, not code: their whole purpose is to contain
# the shapes an extractor has to cope with -- an unused import, a name that
# looks like a credential, a module that imports a package nobody installed.
# Linting them would mean editing the data to satisfy a rule about code, and
# then the fixture no longer exercises what it was written for.
extend-exclude = ["tests/fixtures/languages"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# Without this, `workspace_indexer` sorts into third-party and `tests` lands in
# a different group than the package it tests.
known-first-party = ["workspace_indexer", "tests"]

[tool.pyright]
include = ["src", "tests"]
# Excluded for the same reason ruff excludes them: fixture sources are inputs to
# an extractor, not code this project runs. `pkg.store` imports `requests`
# precisely because an undeclared package has to land in the unclassified
# bucket, and a type checker would report that as an error rather than as the
# point.
exclude = ["tests/fixtures/languages"]
pythonVersion = "3.12"
# Point pyright at the poetry venv, or every third-party import reads as
# unresolved and buries the real diagnostics.
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
